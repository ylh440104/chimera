name: native

on:
  push:
    paths:
      - "src/**"
      - "third_party/yxml/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          cc --version | head -1
          uname -m

      - name: fixup regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_fixups tests/test_fixups.c src/macho.c src/fixups.c
          ./test_fixups

      - name: malformed rejection
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_reject tests/test_reject.c src/macho.c src/fixups.c
          ./test_reject

      - name: format regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_format tests/test_format.c src/format.c
          ./test_format

      - name: scene manifest regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -Wno-unused-parameter -std=gnu11 -Ithird_party/yxml \
             -c third_party/yxml/yxml.c -o yxml.o
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude -Ithird_party/yxml \
             -o test_scene_manifest tests/test_scene_manifest.c src/scene_manifest.c yxml.o
          mkdir -p manifest-case
          cp tests/scene-info.plist manifest-case/Info.plist
          ./test_scene_manifest "$PWD/manifest-case"

      - name: session build
        run: |
          SRC="src/macho.c src/fixups.c src/session.c src/objc.c src/objc_arm64.S \
               src/libcshim.c src/dispatch.c src/foundation.c src/frameworks.c \
               src/format.c src/uikit.c src/scene.c src/scene_manifest.c yxml.o \
               src/trap.c src/loader.c"
          for tool in chmdump chmdemand chimera_run; do
            cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude -Ithird_party/yxml -o "$tool" "tools/$tool.c" $SRC -lm -ldl
          done
          ./chmdump tests/fixture.ios > dump.txt
          head -3 dump.txt
          rc=0
          ./chmdump >usage.txt 2>&1 || rc=$?
          test "$rc" -eq 2
          grep -F 'usage: chmdump' usage.txt

      - name: Darwin ARM64 ABI regressions
        run: |
          if ! command -v clang-18 >/dev/null || ! command -v ld64.lld-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 lld-18
          fi
          CHM_TEST_EXPORT="$PWD/abi-results" sh tests/run_darwin_abi.sh "$PWD/chimera_run"

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-scene-regression
          path: |
            abi-results/SceneCheck.ipa
            abi-results/scene.argb
            abi-results/darwin_scene.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-native
          path: |
            chmdump
            chmdemand
            chimera_run
            test_fixups
            test_reject
            test_format
          if-no-files-found: error