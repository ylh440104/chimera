name: native

on:
  push:
    paths:
      - "src/**"
      - "third_party/yxml/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          cc --version | head -1
          uname -m

      - name: fixup regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_fixups tests/test_fixups.c src/macho.c src/fixups.c
          ./test_fixups

      - name: malformed rejection
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_reject tests/test_reject.c src/macho.c src/fixups.c
          ./test_reject

      - name: format regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude \
             -o test_format tests/test_format.c src/format.c
          ./test_format

      - name: scene manifest regression
        run: |
          cc -O2 -g -Wall -Wextra -Werror -Wno-unused-parameter -std=gnu11 -Ithird_party/yxml \
             -c third_party/yxml/yxml.c -o yxml.o
          cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -Iinclude -Ithird_party/yxml \
             -o test_scene_manifest tests/test_scene_manifest.c src/scene_manifest.c yxml.o
          mkdir -p manifest-case
          cp tests/scene-info.plist manifest-case/Info.plist
          ./test_scene_manifest "$PWD/manifest-case"

      - name: session build
        run: |
          SRC="src/macho.c src/fixups.c src/session.c src/objc.c src/objc_arm64.S \
               src/libcshim.c src/dispatch.c src/foundation.c src/frameworks.c \
               src/format.c src/uikit.c src/scene.c src/scene_manifest.c yxml.o \
               src/trap.c src/loader.c"
          for tool in chmdump chmdemand chimera_run; do
            cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -pthread -Iinclude -Ithird_party/yxml -o "$tool" "tools/$tool.c" $SRC -lm -ldl
          done
          for test in test_input test_table test_services test_startup; do
            cc -O2 -g -Wall -Wextra -Werror -std=gnu11 -pthread -Iinclude -Ithird_party/yxml -o "$test" "tests/$test.c" $SRC -lm -ldl
          done
          ./chmdump tests/fixture.ios > dump.txt
          head -3 dump.txt
          rc=0
          ./chmdump >usage.txt 2>&1 || rc=$?
          test "$rc" -eq 2
          grep -F 'usage: chmdump' usage.txt

      - name: Darwin ARM64 ABI regressions
        run: |
          if ! command -v clang-18 >/dev/null || ! command -v ld64.lld-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 lld-18
          fi
          CHM_TEST_EXPORT="$PWD/abi-results" sh tests/run_darwin_abi.sh "$PWD/chimera_run"
          clang-18 -target arm64-apple-ios15.0 -O2 -fblocks -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_input.m -o abi-results/darwin_input.o
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -exported_symbol _input_check -undefined dynamic_lookup -o abi-results/darwin_input abi-results/darwin_input.o
          mkdir -p abi-results/input-root
          CHM_SANDBOX_ROOT="$PWD/abi-results/input-root" timeout 30 ./test_input "$PWD/abi-results/darwin_input" > abi-results/input.log 2>&1 || { cat abi-results/input.log; exit 1; }
          cat abi-results/input.log
          clang-18 -target arm64-apple-ios15.0 -O2 -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_table.m -o abi-results/darwin_table.o
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -exported_symbol _table_check -undefined dynamic_lookup -o abi-results/darwin_table abi-results/darwin_table.o
          mkdir -p abi-results/table-root
          CHM_SANDBOX_ROOT="$PWD/abi-results/table-root" timeout 30 ./test_table "$PWD/abi-results/darwin_table" > abi-results/table.log 2>&1 || { cat abi-results/table.log; exit 1; }
          cat abi-results/table.log
          clang-18 -target arm64-apple-ios15.0 -O2 -fblocks -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_services.m -o abi-results/darwin_services.o
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -exported_symbol _services_check -undefined dynamic_lookup -o abi-results/darwin_services abi-results/darwin_services.o
          mkdir -p abi-results/services-root
          cp tests/services-info.plist abi-results/Info.plist
          mkdir -p abi-results/en.lproj
          cp tests/Localizable.strings abi-results/en.lproj/Localizable.strings
          CHM_SANDBOX_ROOT="$PWD/abi-results/services-root" timeout 30 ./test_services "$PWD/abi-results/darwin_services" > abi-results/services.log 2>&1 || { cat abi-results/services.log; exit 1; }
          cat abi-results/services.log
          clang-18 -target arm64-apple-ios15.0 -O2 -fblocks -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_startup.m -o abi-results/darwin_startup.o
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -exported_symbol _startup_state -undefined dynamic_lookup -o abi-results/darwin_startup abi-results/darwin_startup.o
          mkdir -p abi-results/startup-root
          CHM_SANDBOX_ROOT="$PWD/abi-results/startup-root" timeout 30 ./test_startup "$PWD/abi-results/darwin_startup" > abi-results/startup.log 2>&1 || { cat abi-results/startup.log; exit 1; }
          cat abi-results/startup.log

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-scene-regression
          path: |
            abi-results/SceneCheck.ipa
            abi-results/scene.argb
            abi-results/darwin_scene.log
            abi-results/container-*.argb
            abi-results/container-*.log
            abi-results/layout.jsonl
            abi-results/darwin_layout.log
            abi-results/input.log
            abi-results/darwin_input
            abi-results/table.log
            abi-results/darwin_table
            abi-results/darwin_services
            abi-results/Info.plist
            abi-results/en.lproj
            abi-results/services.log
            abi-results/startup.log
            abi-results/darwin_startup
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-native
          path: |
            chmdump
            chmdemand
            chimera_run
            test_fixups
            test_reject
            test_format
            test_input
            test_table
            test_services
            test_startup
          if-no-files-found: error