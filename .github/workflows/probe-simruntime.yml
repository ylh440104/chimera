name: probe-simruntime

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: host info
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path || true

      - name: locate runtime roots
        run: |
          echo "== CoreSimulator volumes =="
          ls -1 /Library/Developer/CoreSimulator/Volumes 2>/dev/null || true
          echo "== Profiles/Runtimes =="
          ls -1 /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true
          echo "== find RuntimeRoot =="
          find /Library/Developer/CoreSimulator -maxdepth 6 -name RuntimeRoot -type d 2>/dev/null | head -5

      - name: framework inventory
        run: |
          ROOT=""
          for c in $(find /Library/Developer/CoreSimulator -maxdepth 6 -name RuntimeRoot -type d 2>/dev/null); do
            if [ -d "$c/System/Library/Frameworks/UIKit.framework" ]; then ROOT="$c"; break; fi
          done
          if [ -z "$ROOT" ]; then echo "no simulator runtime with UIKit"; exit 0; fi
          echo "ROOT=$ROOT"
          echo "$ROOT" > /tmp/root.txt
          for fw in UIKit Foundation CoreFoundation CoreGraphics QuartzCore Security;
            do
              B="$ROOT/System/Library/Frameworks/$fw.framework/$fw"
              [ -f "$B" ] && printf '%-16s %s\n' "$fw" "$(stat -f %z "$B")"
            done
          echo "== arch / platform of UIKit =="
          file "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit"
          lipo -info "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit" || true
          vtool -show-build "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit" 2>/dev/null | head -20

      - name: dependency shape
        run: |
          ROOT=$(cat /tmp/root.txt 2>/dev/null)
          [ -z "$ROOT" ] && exit 0
          otool -L "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit" | head -25
          echo "== dylibs available =="
          ls "$ROOT/usr/lib/" | head -30
          echo "count: $(ls "$ROOT/usr/lib/" | wc -l)"

      - name: private framework sample
        run: |
          ROOT=$(cat /tmp/root.txt 2>/dev/null)
          [ -z "$ROOT" ] && exit 0
          ls "$ROOT/System/Library/PrivateFrameworks" 2>/dev/null | head -20
          echo "== Swift =="
          ls "$ROOT/usr/lib/swift" 2>/dev/null | head -10

      - name: extract sample for loader test
        run: |
          ROOT=$(cat /tmp/root.txt 2>/dev/null)
          [ -z "$ROOT" ] && exit 0
          mkdir -p sample
          cp "$ROOT/System/Library/Frameworks/Foundation.framework/Foundation" sample/ 2>/dev/null || true
          cp "$ROOT/System/Library/Frameworks/CoreFoundation.framework/CoreFoundation" sample/ 2>/dev/null || true
          ls -l sample
          for f in sample/*; do
            [ -f "$f" ] || continue
            echo "--- $f"
            file "$f"
            vtool -show-build "$f" 2>/dev/null | sed -n '1,6p'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: simruntime-sample
          path: sample/
          if-no-files-found: warn