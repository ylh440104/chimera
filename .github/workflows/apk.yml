name: apk

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "third_party/**"
      - "include/**"
      - "tests/darwin_formatters.m"
      - "tests/test_formatters.c"
      - "tests/darwin_choices.m"
      - "tests/darwin_strings.m"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: sdk setup
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "no cmdline tools in $SDK"
            ls "$SDK" || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
          echo "sdk ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: restore signing key
        env:
          CHIMERA_SIGNING_STORE: ${{ secrets.CHIMERA_SIGNING_STORE }}
        run: |
          test -n "$CHIMERA_SIGNING_STORE"
          umask 077
          printf '%s' "$CHIMERA_SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/chimera.p12"
          test -s "$RUNNER_TEMP/chimera.p12"

      - name: Darwin formatter device fixture
        run: |
          if ! command -v clang-18 >/dev/null || ! command -v ld64.lld-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 lld-18
          fi
          mkdir -p android/app/src/androidTest/assets
          clang-18 -target arm64-apple-ios15.0 -O2 -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_formatters.m -o "$RUNNER_TEMP/darwin_formatters.o"
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -undefined dynamic_lookup -o android/app/src/androidTest/assets/darwin_formatters "$RUNNER_TEMP/darwin_formatters.o"
          clang-18 -target arm64-apple-ios15.0 -O2 -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_choices.m -o "$RUNNER_TEMP/darwin_choices.o"
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -exported_symbol _choices_check -undefined dynamic_lookup -o android/app/src/androidTest/assets/darwin_choices "$RUNNER_TEMP/darwin_choices.o"
          clang-18 -target arm64-apple-ios15.0 -O2 -fno-objc-arc -fno-builtin -fno-stack-protector -c tests/darwin_strings.m -o "$RUNNER_TEMP/darwin_strings.o"
          ld64.lld-18 -arch arm64 -platform_version ios 15.0 15.0 -e _main -fixup_chains -undefined dynamic_lookup -o android/app/src/androidTest/assets/darwin_strings "$RUNNER_TEMP/darwin_strings.o"

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-instrumented-v1

      - name: prepare Robolectric compile SDK
        run: |
          version=15-robolectric-12650502-i7
          artifact="android-all-instrumented-$version"
          directory="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$version"
          mkdir -p "$directory"
          for extension in pom jar; do
            file="$artifact.$extension"
            url="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$version/$file"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 "$url.sha512" -o "$directory/$file.sha512"
            digest=$(awk '{print $1}' "$directory/$file.sha512")
            if ! (cd "$directory" && printf '%s  %s\n' "$digest" "$file" | sha512sum --check --status); then
              curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 "$url" -o "$directory/$file.part"
              (cd "$directory" && printf '%s  %s\n' "$digest" "$file.part" | sha512sum --check)
              mv "$directory/$file.part" "$directory/$file"
            fi
          done

      - name: assemble
        env:
          CHIMERA_KEYSTORE_PATH: ${{ runner.temp }}/chimera.p12
          CHIMERA_KEYSTORE_PASSWORD: ${{ secrets.CHIMERA_SIGNING_PASSWORD }}
        run: |
          test -n "$CHIMERA_KEYSTORE_PASSWORD"
          cd android
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: archive Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-android-tests
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: verify fixed certificate
        env:
          EXPECTED_CERTIFICATE: ${{ secrets.CHIMERA_SIGNING_SHA256 }}
        run: |
          test -n "$EXPECTED_CERTIFICATE"
          mkdir -p dist
          apk="dist/Chimera-${GITHUB_SHA:0:7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/Chimera-tests-${GITHUB_SHA:0:7}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" > dist/certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/certificate.txt)
          test "$actual" = "$EXPECTED_CERTIFICATE"
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          cd dist
          sha256sum *.apk > SHA256SUMS

      - name: Android native formatter runner
        run: |
          compiler="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$compiler" -O2 -g -Wall -Wextra -Wno-unused-parameter -std=gnu11 -Ithird_party/yxml -c third_party/yxml/yxml.c -o "$RUNNER_TEMP/yxml-android.o"
          "$compiler" -O2 -g -Wall -Wextra -Werror -std=gnu11 -pthread -Iinclude -Ithird_party/yxml \
            -o dist/test_formatters_android tests/test_formatters.c src/macho.c src/fixups.c src/session.c \
            src/objc.c src/objc_arm64.S src/libcshim.c src/dispatch.c src/foundation.c src/frameworks.c \
            src/format.c src/uikit.c src/scene.c src/scene_manifest.c src/trap.c src/loader.c \
            "$RUNNER_TEMP/yxml-android.o" -lm -ldl -lz
          cd dist
          sha256sum test_formatters_android >> SHA256SUMS

      - name: remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/chimera.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-debug-apk
          path: dist/
          if-no-files-found: error

      - name: publish build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_RUN_ID}"
          printf '固定签名构建，提交 %s。\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Chimera ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
          gh release upload "$tag" dist/* --clobber