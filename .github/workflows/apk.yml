name: apk

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: sdk setup
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "no cmdline tools in $SDK"
            ls "$SDK" || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
          echo "sdk ready"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: assemble
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error