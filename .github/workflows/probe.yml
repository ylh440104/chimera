name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - macos-15
          - macos-13-large
          - macos-14-large
          - macos-15-large
          - macos-13-xlarge
          - macos-14-xlarge
          - macos-15-xlarge
    runs-on: ${{ matrix.os }}
    steps:
      - name: collect
        if: always()
        run: |
          L=probe-${{ matrix.os }}.log
          : > $L
          {
            echo "runner=${{ matrix.os }}"
            uname -m
            sw_vers
            xcodebuild -version 2>/dev/null
            echo "--- roots"
            ls -1 /Library/Developer/CoreSimulator 2>/dev/null
            echo "--- profiles"
            ls -1 /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null
            echo "--- volumes"
            ls -1 /Library/Developer/CoreSimulator/Volumes 2>/dev/null
            echo "--- sdk"
            ls -1 /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs 2>/dev/null
          } >> $L 2>&1

      - name: framework scan
        if: always()
        run: |
          L=probe-${{ matrix.os }}.log
          ROOT=""
          for c in \
            $(ls -d /Library/Developer/CoreSimulator/Volumes/*/Library/Developer/CoreSimulator/Profiles/Runtimes/*/Contents/Resources/RuntimeRoot 2>/dev/null) \
            $(ls -d /Library/Developer/CoreSimulator/Profiles/Runtimes/*/Contents/Resources/RuntimeRoot 2>/dev/null)
          do
            if [ -f "$c/System/Library/Frameworks/UIKit.framework/UIKit" ]; then ROOT="$c"; break; fi
          done
          if [ -z "$ROOT" ]; then echo "NO_RUNTIME_ROOT" >> $L; exit 0; fi
          echo "ROOT=$ROOT" >> $L
          for fw in UIKit Foundation CoreFoundation CoreGraphics QuartzCore Security CoreText; do
            B="$ROOT/System/Library/Frameworks/$fw.framework/$fw"
            if [ -f "$B" ]; then
              echo "FW $fw size=$(stat -f %z "$B") arch=$(lipo -archs "$B" 2>/dev/null)" >> $L
            fi
          done
          {
            echo "--- UIKit build version"
            vtool -show-build "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit" 2>/dev/null | head -30
            echo "--- UIKit deps"
            otool -L "$ROOT/System/Library/Frameworks/UIKit.framework/UIKit" 2>/dev/null | head -20
            echo "--- usr/lib total"
            ls -1 "$ROOT/usr/lib" 2>/dev/null | wc -l
            echo "--- private frameworks total"
            ls -1 "$ROOT/System/Library/PrivateFrameworks" 2>/dev/null | wc -l
            echo "--- swift libs"
            ls -1 "$ROOT/usr/lib/swift" 2>/dev/null | head -10
          } >> $L 2>&1

      - name: symbol scan
        if: always()
        run: |
          L=probe-${{ matrix.os }}.log
          F=""
          for c in \
            $(ls -d /Library/Developer/CoreSimulator/Volumes/*/Library/Developer/CoreSimulator/Profiles/Runtimes/*/Contents/Resources/RuntimeRoot 2>/dev/null) \
            $(ls -d /Library/Developer/CoreSimulator/Profiles/Runtimes/*/Contents/Resources/RuntimeRoot 2>/dev/null)
          do
            if [ -f "$c/System/Library/Frameworks/Foundation.framework/Foundation" ]; then F="$c/System/Library/Frameworks/Foundation.framework/Foundation"; break; fi
          done
          [ -z "$F" ] && { echo "NO_FOUNDATION" >> $L; exit 0; }
          {
            echo "--- Foundation exports=$(nm -gU "$F" 2>/dev/null | wc -l)"
            echo "--- Foundation objc classes=$(nm -gU "$F" 2>/dev/null | grep -c '_OBJC_CLASS_\$_')"
            echo "--- Foundation undef=$(nm -u "$F" 2>/dev/null | wc -l)"
            echo "--- UIKit objc classes=$(nm -gU "$(dirname $(dirname $F))/UIKit.framework/UIKit" 2>/dev/null | grep -c '_OBJC_CLASS_\$_')"
          } >> $L 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe-${{ matrix.os }}.log
          if-no-files-found: warn
          retention-days: 5